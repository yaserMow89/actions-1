
name: Exploring vars and secrets
on: push
# This is workflow level env var
env:
  CONTAINER_REGISTRY: docker.io
  DOCKER_USERNAME: siddharth1

jobs:
  docker_job:
    # THis is job level env var
    env:
      IMAGE_NAME: github-actions-nginx
    runs-on: ubuntu-latest
    steps:
# We will enable the env vars at each level
      - name: Dcoker build
        run: docker build -t $CONTAINER_REGISTRY/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Dokcer Login
        # This is step level env var
        env:
          DOCKER_PASSWORD: s3cUrePaSsw0rd
        run: docker login --username=$DOCKER_USERNAME --password=$DOCKER_PASSWORD
      
      - name: Docker publish
        env:
          DOCKER_REGISTRY: docker.io
          DOCKER_USERNAME: siddharth1
          DOCKER_IMAGE: github-actions-nginx
        run: docker push $DOCKER_REGISTRY/${{ env.DOCKER_USERNAME }}/$DOCKER_IMAGE:latest
        
  deploy_job:
    needs: docker
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: github-actions-nginx
    steps:
      - name: Docker Run
        run: docker run -d -p 8080:80 ${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest