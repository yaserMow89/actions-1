name: Generate ascii

on: [push]

jobs:
    build_job_1:
      runs-on: ubuntu-latest
      steps:
        - name: Install cowsay
          run: sudo apt install cowsay -y

        - name: Execute Cowsay CMD
          run: cowsay -f dragon "I am a DRAGON, run you infidel.....Dracarys" >> dragon.txt

        - name: sleep job
          run: sleep 10
    test_job_2:
      runs-on: ubuntu-latest
      steps:
        - name: sleep for 10 seconds
          run: sleep 10
        
        - name: Test File Exists
          run: grep -i "dragon" dragon.txt
    
    deploy_job_3:
      runs-on: ubuntu-latest
      steps:
        - name: Read file
          run: cat dragon.txt
        
        - name: Deploy
          run: echo We are deploying
      
