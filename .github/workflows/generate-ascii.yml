name: Generate ascii

on: [push]

jobs:
    build_job_1:
      runs-on: ubuntu-latest
      steps:
        - name: Install cowsay
          run: sudo apt install cowsay -y

        - name: Execute Cowsay CMD
          run: cowsay -f dragon "I am a DRAGON, run you infidel.....Dracarys" >> dragon.txt

        - name: Upload the dragon file
          uses: actions/upload-artificat@v7
          with:
            name: dragon-text-file
            path: dragon.txt

    test_job_2:
      needs: build_job_1
      runs-on: ubuntu-latest
      steps:
        - name: Download the artifiact
          uses: actions/upload-artifiact@v8
          with:
            name: dragon-text-file
        
        - name: Test File Exists
          run: grep -i "dragon" dragon-text-file
    
    deploy_job_3:
      needs: 
        - build_job_1
        - test_job_2
      runs-on: ubuntu-latest
      steps:
        - name: Read file
          run: cat dragon-text-file
        
        - name: Deploy
          run: echo We are deploying
      