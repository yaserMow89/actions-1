name: My First example of a workflow

on: [push]

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:

            - name: Checkout the repo
              uses: actions/checkout@v7

            - name: Welcome message
              run: echo " My first Github Actions job"
            
            - name: List files
              run: ls
            
            - name: Read files
              run: cat README.md